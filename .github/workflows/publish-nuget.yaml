name: Publish NuGet

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # fetch-depth: 0 because the packages derive their version from commit height
    # (version.json + Nerdbank.GitVersioning, wired in MakePackage.targets). actions/checkout
    # defaults to a depth-1 SHALLOW clone, on which NBGV throws MSB4018 rather than guessing.
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        # 10.x, not 9.x: every project here targets net10.0, which a 9 SDK cannot build. This
        # line had never been exercised against the net10 conversion - the workflow only runs on
        # main, and the work happens on dev - so nothing caught it. Unlike LazyMagic and lz, this
        # repo ships no global.json, so there is no SDK pin for a floating version to collide
        # with; add one and switch to global-json-file if that changes.
        dotnet-version: '10.x'

    - name: Configure NuGet
      run: |
        cat > NuGet.Config << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="github" value="https://nuget.pkg.github.com/Banquet-Consulting/index.json" />
            <add key="LazyMagic" value="https://nuget.pkg.github.com/LazyMagicOrg/index.json" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceCredentials>
            <github>
              <add key="Username" value="USERNAME" />
              <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
            </github>
            <LazyMagic>
              <add key="Username" value="USERNAME" />
              <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
            </LazyMagic>
          </packageSourceCredentials>
        </configuration>
        EOF

        cat NuGet.Config

    - name: Remove MAUIApp project from solution
      run: dotnet sln BaseAppLib.sln remove "./MAUIApp/MAUIApp.csproj"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build # Build solution
      run: dotnet build --no-restore

    - name: Publish
      run: |
        dotnet nuget push ../Packages/*.nupkg --source https://nuget.pkg.github.com/Banquet-Consulting/index.json --api-key ${{ secrets.GITHUB_TOKEN }}
        dotnet nuget push ../Packages/*.snupkg --source https://nuget.pkg.github.com/Banquet-Consulting/index.json --api-key ${{ secrets.GITHUB_TOKEN }}